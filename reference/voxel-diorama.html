<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Voxel Pixel Shader Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: rgba(30,21,17,0.92);
    --edge:#5a4030;
    --ink:#f1e2c2;
    --dim:#b9a283;
    --accent:#e8a444;
    --accent2:#c8643a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1410;color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
  canvas#view{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;
    image-rendering:pixelated}
  #hud{position:fixed;left:10px;top:10px;padding:6px 9px;background:var(--bg);border:2px solid var(--edge);
    font-family:"Silkscreen",monospace;font-size:11px;letter-spacing:.5px;pointer-events:none;line-height:1.5}
  #hud b{color:var(--accent);font-weight:400}
  #prof{display:none;margin:6px 0 0;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.45;color:var(--ink);white-space:pre}
  #hint{position:fixed;left:10px;bottom:10px;padding:5px 8px;background:var(--bg);border:2px solid var(--edge);
    color:var(--dim);font-size:11px;pointer-events:none}
  #panel{position:fixed;right:10px;top:10px;bottom:10px;width:300px;overflow-y:auto;background:var(--bg);
    border:2px solid var(--edge);padding:10px 12px 14px;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
  #panel h1{font-family:"Silkscreen",monospace;font-weight:400;font-size:15px;margin:0 0 2px;color:var(--accent);letter-spacing:.5px}
  #panel .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  details{border-top:1px dashed var(--edge);padding:6px 0 2px}
  summary{font-family:"Silkscreen",monospace;cursor:pointer;color:var(--ink);font-size:12px;list-style:none;padding:2px 0 6px;user-select:none}
  summary::before{content:"▸ ";color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;margin:0 0 8px}
  .row label{color:var(--dim)}
  .row .val{color:var(--ink);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  .row input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:2px 0 0;height:18px}
  .row select,.preset select{background:#2a1e18;color:var(--ink);border:1px solid var(--edge);font:inherit;padding:4px 6px;width:100%}
  .row.sel{grid-template-columns:1fr 1.2fr}
  .row input[type=color]{width:44px;height:22px;border:1px solid var(--edge);background:none;padding:0}
  .tog{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;cursor:pointer;color:var(--dim)}
  .tog input{display:none}
  .tog .sw{width:34px;height:16px;background:#3a2a20;border:1px solid var(--edge);position:relative;flex:none}
  .tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;background:var(--dim)}
  .tog input:checked + .sw{background:#6a3e1e}
  .tog input:checked + .sw::after{left:20px;background:var(--accent)}
  .preset{margin:0 0 10px}
  .preset label{display:block;font-family:"Silkscreen",monospace;color:var(--accent2);margin-bottom:4px}
  #toggle{display:none}
  @media (max-width:720px){
    #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52vh;border-left:none;border-right:none;border-bottom:none;
      transform:translateY(0);transition:transform .2s}
    #panel.hidden{transform:translateY(100%)}
    #toggle{display:block;position:fixed;right:10px;top:10px;z-index:3;background:var(--bg);color:var(--accent);
      border:2px solid var(--edge);font-family:"Silkscreen",monospace;font-size:12px;padding:6px 10px}
    #hint{display:none}
  }
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--ink)}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">FPS <b id="fps">--</b> · <span id="res">--</span> · <span id="tris"></span><pre id="prof"></pre></div>
<div id="hint">Drag: orbit · Right-drag / two fingers: pan · Scroll / pinch: zoom</div>
<button id="toggle">Tune ▾</button>
<div id="panel">
  <h1>Pixel Diorama</h1>
  <div class="sub">Low-res render → outlines → grade → dither → palette → nearest upscale</div>
  <div class="preset"><label for="preset">Style preset</label><select id="preset"></select></div>
  <div id="controls"></div>
</div>
<div id="err"></div>

<!-- =====================================================================
     SHADERS (plain GLSL, kept separate so they port cleanly to Godot)
     ===================================================================== -->

<!-- Pass 1: scene material. Toon-banded sun + ambient + point lights,
     per-voxel colour jitter, grass side strips, ore flecks, emissives. -->
<script type="x-shader/x-vertex" id="toon-vs">
  attribute vec3 aColor;   // base albedo (display-space RGB)
  attribute vec4 aAux;     // x: vertex AO 0..1, y: sky exposure 0..1, z: emissive flag, w: material class
  attribute float aType;   // block type (atlas row); 0 on props/dwarfs = untextured
  attribute vec3 aTexPos;  // terrain: voxel-space position for texture UVs
  attribute vec3 aLook;    // terrain: axis normal choosing projection + top/side/bottom tile
  attribute vec3 aCell;    // terrain: owning voxel (+0.5), or -999 = derive from aTexPos
  varying float vType;
  varying vec3 vTexPos, vLook, vCell;
  varying vec3 vColor;
  varying vec4 vAux;
  varying vec3 vWPos;
  varying vec3 vWNrm;
  invariant gl_Position;   // identical depth in the pre-pass and the colour pass
  void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWPos = wp.xyz;
    vWNrm = normalize(mat3(modelMatrix) * normal);
    vColor = aColor;
    vAux = aAux;
    vType = aType; vTexPos = aTexPos; vLook = aLook; vCell = aCell;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
</script>
<!-- Shared toon lighting (uniforms + helpers), prepended to the scene and foliage shaders. -->
<script type="x-shader/x-fragment" id="toon-common">
  uniform vec3  uSunDir;        // direction TO the light (sun or moon), world space
  uniform vec3  uSunColor;      // colour * intensity
  uniform vec3  uAmbientColor;
  uniform float uAmbient;
  uniform float uBands;         // number of toon bands
  uniform float uTime;
  uniform float uObjExposure;   // per-object sky exposure multiplier (dwarfs underground)
  uniform float uShadowOn;
  uniform float uTorch;         // global torch / forge multiplier
  uniform sampler2D uShadowMap; // sun depth map
  uniform mat4  uShadowMatrix;  // world -> sun clip
  uniform vec3  uPointPos[4];
  uniform vec3  uPointCol[4];
  uniform float uPointRange[4];
  uniform vec3  uDirtCol;
  uniform vec3  uOreHost;
  uniform vec3  uChunkOrigin;   // world position of voxel (0,0,0)
  float hash3(vec3 p){
    p = fract(p * 0.3183099 + 0.1);
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  // Quantise a 0..1 light amount into uBands flat steps.
  float band(float x){ return clamp(floor(x * uBands + 0.5) / uBands, 0.0, 1.0); }

  float sunShadow(vec3 wp, vec3 n){
    vec4 lp = uShadowMatrix * vec4(wp + n * 0.08, 1.0);   // normal offset vs acne
    vec3 c = lp.xyz / lp.w * 0.5 + 0.5;
    if (c.x < 0.0 || c.y < 0.0 || c.x > 1.0 || c.y > 1.0 || c.z > 1.0) return 1.0;
    return (c.z - 0.0015 > texture2D(uShadowMap, c.xy).r) ? 0.0 : 1.0;
  }

  // Full toon light: ambient (scaled by sky exposure & AO) + banded, shadowed sun + banded point lights.
  uniform float uRim, uSpec;   // cel rim light and hard specular highlight (0 = off)
  vec3 toonLighting(vec3 N, vec3 wp, float ao, float sky){
    vec3 light = uAmbientColor * uAmbient * mix(0.12, 1.0, sky) * ao;
    float ndl = max(dot(N, uSunDir), 0.0);
    // Faces turned away from the sun skip the shadow-map read (unless glints need it).
    float sh  = (uShadowOn > 0.5 && (ndl > 0.0 || uSpec > 0.0)) ? sunShadow(wp, N) : 1.0;
    float skyK = smoothstep(0.02, 0.35, sky);
    light += uSunColor * band(ndl * sh) * mix(0.55, 1.0, ao) * skyK;
    if (uRim > 0.0 || uSpec > 0.0) {
      vec3 V = normalize(cameraPosition - wp);
      float rim = step(0.62, 1.0 - max(dot(N, V), 0.0)) * (0.35 + 0.65 * ndl);
      light += (uSunColor + uAmbientColor * 0.4) * rim * uRim * 0.7 * skyK;
      float sp = pow(max(dot(N, normalize(uSunDir + V)), 0.0), 40.0);
      light += uSunColor * step(0.55, sp) * sh * uSpec * 1.6 * skyK;
    }
    for (int i = 0; i < 4; i++) {
      vec3 L = uPointPos[i] - wp;
      float d = length(L);
      if (d >= uPointRange[i]) continue;                 // most pixels are out of every torch's reach
      float att = clamp(1.0 - d / uPointRange[i], 0.0, 1.0);
      att *= att;
      float pn = max(dot(N, L / max(d, 1e-3)), 0.0) * 0.7 + 0.3;
      light += uPointCol[i] * band(att * pn * 1.6) * uTorch;
    }
    return light;
  }
  float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
  float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
</script>
<script type="x-shader/x-fragment" id="toon-fs">
  // Material classes (aAux.w): 0 generic voxel, 1 water, 2 prop (no jitter), 3 grass, 4 ore
  uniform sampler2D uAtlas;      // block texture atlas: columns top/side/bottom, rows = block type
  uniform vec2  uAtlasSize;
  uniform float uTileT;          // tile resolution (4, 8, 16)
  uniform float uTexStrength;    // 0 = flat colour
  uniform float uObjAlpha;       // material ID for non-terrain objects (dwarf / trunk / torch)
  varying float vType;
  varying vec3 vTexPos, vLook, vCell;
  varying vec3 vColor;
  varying vec4 vAux;
  varying vec3 vWPos;
  varying vec3 vWNrm;

  void main(){
    vec3 N = normalize(vWNrm);               // smooth normal (rounded edges blend) for lighting
  #ifdef MRT
    outNormal = vec4(N * 0.5 + 0.5, vType > 0.5 ? (floor(vType + 0.5) + 1.0) * 8.0 / 255.0 : uObjAlpha);  // combined pass: normals + material ID
  #endif
    vec3 Ng = normalize(cross(dFdx(vWPos), dFdy(vWPos)));   // flat geometric normal for voxel lookups
    if (dot(Ng, N) < 0.0) Ng = -Ng;
    vec3 vp = vWPos - uChunkOrigin;          // voxel-space position
    // Terrain carries baked lookup data (stable on bevels); props fall back to derivatives.
    bool terrain = vType > 0.5;
    vec3 Lk = terrain ? normalize(vLook) : Ng;           // axis normal for projection / tile choice
    vec3 tp = terrain ? vTexPos : vp;                    // position for face UVs
    vec3 cell = terrain ? (vCell.x > -100.0 ? floor(vCell) : floor(tp - Lk * 0.5))
                        : floor(vp - Ng * 0.3);          // voxel this surface belongs to
    float cls = vAux.w;
    vec3 albedo = vColor;
    float jitter = 0.93 + 0.14 * hash3(cell);
    if (cls < 0.5 || cls > 2.5) albedo *= jitter;

    // Grass: dirt sides with a ragged green lip, dirt underneath.
    if (abs(cls - 3.0) < 0.5 && Lk.y < 0.5) {
      vec2 fc = abs(Lk.x) > 0.5 ? tp.zy : tp.xy;
      float lip = 0.70 - 0.14 * step(0.5, hash3(vec3(floor(fc.x * 4.0), cell.y, 3.0)));
      if (Lk.y < -0.5 || fract(tp.y) < lip) albedo = uDirtCol * jitter;
    }
    // Ore: 4x4 grid of flecks per face over host stone.
    if (abs(cls - 4.0) < 0.5) {
      vec2 fc = abs(Lk.x) > 0.5 ? tp.zy : (abs(Lk.y) > 0.5 ? tp.xz : tp.xy);
      vec2 g = floor(fract(fc) * 4.0);
      if (hash3(vec3(g, dot(cell, vec3(1.0, 7.0, 13.0)))) < 0.6) albedo = uOreHost * jitter;
    }
    // Block textures. Face-local UVs come from world position, so greedy-merged quads
    // tile correctly. Top/bottom tiles get a random 90° turn per voxel to hide repeats.
    if (vType > 0.5 && uTexStrength > 0.0) {
      vec3 an = abs(Lk);
      vec2 fuv; float face = 1.0;
      if (an.y >= an.x && an.y >= an.z) { fuv = tp.xz; face = Lk.y > 0.0 ? 0.0 : 2.0; }
      else if (an.x >= an.z) fuv = tp.zy;
      else fuv = tp.xy;
      vec2 f = fract(fuv);
      if (face != 1.0) {
        float r = floor(hash3(cell + 5.3) * 4.0);
        if (r == 1.0) f = vec2(f.y, 1.0 - f.x); else if (r == 2.0) f = 1.0 - f; else if (r == 3.0) f = vec2(1.0 - f.y, f.x);
      }
      vec2 texel = min(floor(f * uTileT), vec2(uTileT - 1.0));
      vec2 apx = vec2(face * uTileT, floor(vType + 0.5) * uTileT) + texel + 0.5;
      vec3 tex = texture2D(uAtlas, apx / uAtlasSize).rgb;
      albedo = mix(albedo, tex * mix(1.0, jitter, 0.5), uTexStrength);
    }

    // Emissives (forge embers, torch flames): unlit, gentle flicker.
    if (vAux.z > 0.5) {
      float fl = 0.92 + 0.08 * sin(uTime * 11.0 + cell.x * 1.7 + cell.z) * sin(uTime * 7.3 + cell.y);
      gl_FragColor = vec4(albedo * 1.2 * fl, 1.0);
      return;
    }

    float ao  = vAux.x;
    float sky = vAux.y * uObjExposure;

    vec3 light = toonLighting(N, vWPos, ao, sky);

    // Water: blocky animated glints on the surface.
    if (abs(cls - 1.0) < 0.5 && Lk.y > 0.5) {
      float w = sin(vp.x * 2.1 + uTime * 1.4) * sin(vp.z * 1.7 - uTime * 1.1) + 0.5 * sin((vp.x + vp.z) * 3.3 + uTime * 2.0);
      albedo *= 0.92 + 0.08 * step(0.0, w);
      albedo = mix(albedo, albedo * 1.35 + 0.08, step(0.95, w));
    }

    gl_FragColor = vec4(albedo * light, 1.0);
  }
</script>

<!-- Foliage (tree canopies, bushes). One source, compiled three ways with
     PASS_COLOR / PASS_NORMAL / PASS_DEPTH so the dithered holes match in the colour,
     normal and shadow passes. Techniques (uFolMode):
       0 = dithered shell: screen-door transparency from world-space leaf cells mixed
           with a screen Bayer pattern; thins out toward the silhouette (edge fade).
       1 = solid: opaque blobs, toon banded.
       2 = leaf cards: many small alpha-tested quads with a procedural leaf shape.
     Normals can blend from faceted to "spherical" (pointing out from the canopy
     centre), the usual trick for soft, readable stylised foliage. -->
<script type="x-shader/x-vertex" id="foliage-vs">
  attribute vec3 aColor;
  attribute vec3 aSphere;   // canopy-centred normal
  attribute vec4 aAux;      // x: layer (0 outer, 1 inner core), y: sway weight, z: is leaf card, w: per-tree seed
  uniform float uTime, uSway;
  varying vec3 vColor, vWPos, vRest, vNFlat, vNSphere;
  varying vec4 vAux;
  varying vec2 vUv;
  invariant gl_Position;
  void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vRest = wp.xyz;                                   // un-swayed: leaf cells stick to the canopy
    float s = aAux.y * uSway;
    float ph = aAux.w * 6.283;
    wp.x += (sin(uTime * 1.3 + wp.z * 0.35 + ph) + 0.4 * sin(uTime * 3.1 + wp.y)) * 0.12 * s;
    wp.z += cos(uTime * 1.1 + wp.x * 0.35 + ph) * 0.10 * s;
    wp.y += sin(uTime * 2.3 + wp.x + wp.z) * 0.03 * s;
    vWPos = wp.xyz;
    vNFlat = normalize(mat3(modelMatrix) * normal);
    vNSphere = normalize(mat3(modelMatrix) * aSphere);
    vColor = aColor; vAux = aAux; vUv = uv;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
</script>
<script type="x-shader/x-fragment" id="foliage-fs">
  uniform float uFolMode, uDensity, uLeafSize, uEdgeFade, uScreenMix, uSphere, uTransl, uInnerDark, uHueVar;
  uniform vec2  uScreenOffset;    // whole-texel camera offset, keeps the screen pattern locked to the world
  varying vec3 vColor, vWPos, vRest, vNFlat, vNSphere;
  varying vec4 vAux;
  varying vec2 vUv;

  void main(){
    vec3 Nf = normalize(vNFlat);
    if (!gl_FrontFacing) Nf = -Nf;                     // leaf cards are double sided
    vec3 Ns = normalize(vNSphere);
    vec3 N  = normalize(mix(Nf, Ns, uSphere));
    float layer = vAux.x;
    vec3 leafCell = floor(vRest / uLeafSize);
    float h = hash3(leafCell + vAux.w * 17.0);

    if (vAux.z > 0.5) {
      // Leaf card: teardrop leaf silhouette from UVs.
      vec2 q = vUv * 2.0 - 1.0;
      if (length(vec2(q.x / (0.62 * (1.0 - 0.4 * q.y)), q.y)) > 1.0) discard;
    } else if (uFolMode < 0.5) {
      // Dithered shell. Coverage drops toward the silhouette, the inner core is denser.
      vec3 V = normalize(cameraPosition - vWPos);
      float facing = abs(dot(Ns, V));
      float a = uDensity * mix(1.0, smoothstep(0.05, 0.75, facing), uEdgeFade);
      if (layer > 0.5) a = mix(a, 1.0, 0.55);
  #ifdef PASS_DEPTH
      float thr = h;                                   // world-only pattern: dappled, stable shadows
  #else
      float thr = mix(h, bayer4(gl_FragCoord.xy + uScreenOffset), uScreenMix);
  #endif
      if (thr > a) discard;
    }

  #if defined(PASS_COLOR) && defined(MRT)
    outNormal = vec4(N * 0.5 + 0.5, (floor(vAux.w) + 1.0) / 255.0);   // foliage species ID
  #endif
  #if defined(PASS_NORMAL)
    gl_FragColor = vec4(N * 0.5 + 0.5, (floor(vAux.w) + 1.0) / 255.0); // foliage species ID           // alpha 0 = foliage (post pass uses it)
  #elif defined(PASS_DEPTH)
    gl_FragColor = vec4(1.0);
  #else
    // Per-leaf colour variation toward yellow-green / blue-green, darker inner core.
    float hv = hash3(leafCell + 3.1) - 0.5;
    vec3 albedo = vColor * (1.0 + hv * 0.35 * uHueVar);
    albedo = mix(albedo, albedo * vec3(1.15, 1.08, 0.7), max(hv, 0.0) * uHueVar);
    albedo *= mix(1.0, 0.55, layer * uInnerDark);
    vec3 light = toonLighting(N, vWPos, mix(1.0, 0.7, layer), 1.0);
    // Back-light translucency: leaves glow when the sun is behind them.
    light += uSunColor * band(max(dot(-N, uSunDir), 0.0) * uTransl) * 0.6;
    gl_FragColor = vec4(albedo * light, 1.0);
  #endif
  }
</script>

<!-- Pass 1b: world-space normals for edge detection (rendered at the same low res).
     World space (not view space) keeps crease decisions stable while orbiting. -->
<script type="x-shader/x-vertex" id="normal-vs">
  attribute float aType;   // block type (terrain only; 0 elsewhere)
  varying vec3 vN;
  varying float vType;
  void main(){
    vN = normalize(mat3(modelMatrix) * normal);
    vType = aType;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
</script>
<script type="x-shader/x-fragment" id="normal-fs">
  // Alpha carries a material ID: 0 = foliage, (type+1)*8/255 = terrain block, 1 = props/dwarfs.
  uniform float uObjAlpha;
  varying vec3 vN;
  varying float vType;
  void main(){ gl_FragColor = vec4(normalize(vN) * 0.5 + 0.5, vType > 0.5 ? (floor(vType + 0.5) + 1.0) * 8.0 / 255.0 : uObjAlpha); }
</script>

<!-- Shared fullscreen-triangle vertex shader. -->
<script type="x-shader/x-vertex" id="quad-vs">
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
</script>

<!-- Pass 2 (low res): outlines -> colour grade -> Bayer dither -> palette snap. -->
<script type="x-shader/x-fragment" id="post-fs">
  uniform sampler2D tColor;
  uniform sampler2D tDepth;
  uniform sampler2D tNormal;
  uniform vec2  uRes;            // low-res target size in texels
  uniform float uNear, uFar, uOrtho;
  uniform float uTexelWorld;     // ortho: world units per texel; perspective: per texel per unit depth
  uniform float uOutlineOn, uOuter, uInner, uDepthThr, uNormalThr;
  uniform vec3  uOutlineColor;
  uniform float uSat, uContrast, uBright;
  uniform float uPaletteOn, uDither, uBayer, uSpread;
  uniform highp sampler3D uPalLUT;   // 32^3 lookup: any colour -> nearest palette entry (baked on CPU)
  uniform vec2  uDitherOffset;   // whole-texel camera offset: keeps dither locked to the world
  uniform float uFolOutline;     // foliage outlines: 0 none, 1 canopy silhouette only, 2 every leaf cluster
  uniform float uOutlineW;       // outer outline width in texels (1 or 2)
  // Art-style effects (all 0 = off)
  uniform float uFog, uFogRef;   // depth fog amount; distance to the orbit target
  uniform vec3  uFogColor;
  uniform float uWobble;         // painterly UV jitter, in texels
  uniform float uEdgeDarken;     // watercolour pigment pooling at colour edges
  uniform float uHatch;          // ink cross-hatching
  uniform vec3  uPaper;
  uniform float uToneMix;        // duotone: luminance mapped from uToneA (dark) to uToneB (light)
  uniform vec3  uToneA, uToneB;
  uniform float uGrain, uGrainAnim, uTime;
  uniform vec2  uUvScale;       // rendered sub-region / full target (far view renders fewer pixels)
  varying vec2 vUv;

  float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x), mix(hash2(i + vec2(0, 1)), hash2(i + 1.0), f.x), f.y);
  }

  float rawDepth(vec2 uv){ return texture2D(tDepth, uv).r; }
  float linFromRaw(float d){
    if (uOrtho > 0.5) return uNear + d * (uFar - uNear);
    float z = d * 2.0 - 1.0;
    return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear));
  }
  float linDepth(vec2 uv){ return linFromRaw(rawDepth(uv)); }
  vec3 nrm(vec2 uv){ return texture2D(tNormal, uv).xyz * 2.0 - 1.0; }
  float isFol(vec2 uv){ return step(texture2D(tNormal, uv).a, 0.02); }   // normal alpha ~0 marks foliage

  // Outer silhouette along one screen axis. A neighbour must be farther than the
  // threshold AND the second difference must agree — a tilted flat surface has a
  // large first difference but ~zero second difference, so it no longer gets inked
  // at grazing angles or when zoomed out.
  float outerAxis(float d, float da, float db, float thr){
    bool farther = (da - d > thr) || (db - d > thr);
    return (farther && (da + db - 2.0 * d) > thr) ? 1.0 : 0.0;
  }
  // Inner crease against one neighbour. Normals are WORLD space, and the 1-px side
  // is chosen with a fixed world bias (favours top faces), so the line never flips
  // sides as the camera orbits.
  float creaseN(float d, vec3 n, float dn, vec3 nn, float thr){
    if (abs(dn - d) > thr || dot(n - nn, vec3(0.31, 1.0, 0.17)) <= 0.02) return 0.0;
    return 1.0 - dot(n, nn);
  }

  float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
  float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
  float bayer8(vec2 a){ return bayer4(0.5 * a) * 0.25 + bayer2(a); }


  void main(){
    vec2 uvq = vUv * uUvScale;
    vec2 wp = floor(gl_FragCoord.xy) + uDitherOffset;            // world-locked pixel coords
    vec2 cuv = uvq;
    if (uWobble > 0.0) {                                           // painterly: broken, wobbly colour edges
      vec2 w = vec2(vnoise(wp * 0.21), vnoise(wp * 0.21 + 17.3)) * 2.0 - 1.0;
      cuv += w * uWobble / uRes;
    }
    vec3 col = texture2D(tColor, cuv).rgb;
    float dC = rawDepth(uvq);

    // --- Depth fog (aerial perspective) ---
    if (uFog > 0.0 && dC < 0.99999) {
      float f = smoothstep(-32.0, 56.0, linFromRaw(dC) - uFogRef);
      col = mix(col, uFogColor, f * uFog);
    }

    // --- Watercolour edge darkening ---
    if (uEdgeDarken > 0.0) {
      vec2 px = 1.0 / uRes;
      vec3 avg = (texture2D(tColor, cuv + vec2(px.x, 0.0)).rgb + texture2D(tColor, cuv - vec2(px.x, 0.0)).rgb +
                  texture2D(tColor, cuv + vec2(0.0, px.y)).rgb + texture2D(tColor, cuv - vec2(0.0, px.y)).rgb) * 0.25;
      col *= 1.0 - uEdgeDarken * 0.45 * smoothstep(0.04, 0.25, length(col - avg));
    }

    // --- Outlines ---
    if (uOutlineOn > 0.5 && dC < 0.99999) {
      float d = linFromRaw(dC);
      vec4 nC = texture2D(tNormal, uvq);
      vec3 n = nC.xyz * 2.0 - 1.0;
      // World size of one low-res texel at this depth. Thresholds grow when a texel
      // covers more world, so distant detail doesn't drown in outlines.
      float tw = uOrtho > 0.5 ? uTexelWorld : d * uTexelWorld;
      float thr = uDepthThr * max(1.0, tw * 6.0);
      vec2 px = 1.0 / uRes;
      vec2 ox = vec2(px.x, 0.0), oy = vec2(0.0, px.y);
      float fol = step(nC.a, 0.02);
      // 1-texel neighbours, sampled once and shared by the silhouette and crease tests.
      // Normal RGBA is fetched once per neighbour: xyz = normal, a = foliage flag.
      float d1R = linDepth(uvq + ox), d1L = linDepth(uvq - ox), d1U = linDepth(uvq + oy), d1D = linDepth(uvq - oy);
      bool folSil = fol > 0.5 && uFolOutline < 1.5;
      bool wantCrease = fol < 0.5 && uInner != 0.0;
      vec4 qR = vec4(0.5, 0.5, 0.5, 1.0), qL = qR, qU = qR, qD = qR;
      if (wantCrease || folSil) {
        qR = texture2D(tNormal, uvq + ox); qL = texture2D(tNormal, uvq - ox);
        qU = texture2D(tNormal, uvq + oy); qD = texture2D(tNormal, uvq - oy);
      }
      float inner = 0.0;
      if (wantCrease) {
        inner = max(max(creaseN(d, n, d1R, qR.xyz * 2.0 - 1.0, thr), creaseN(d, n, d1L, qL.xyz * 2.0 - 1.0, thr)),
                    max(creaseN(d, n, d1U, qU.xyz * 2.0 - 1.0, thr), creaseN(d, n, d1D, qD.xyz * 2.0 - 1.0, thr)));
      }
      float outer = 0.0;
      for (int k = 1; k <= 2; k++) {                     // width 2 also tests neighbours 2 texels out
        if (float(k) > uOutlineW) break;
        vec2 kx = ox * float(k), ky = oy * float(k);
        float dR = k == 1 ? d1R : linDepth(uvq + kx), dL = k == 1 ? d1L : linDepth(uvq - kx);
        float dU = k == 1 ? d1U : linDepth(uvq + ky), dD = k == 1 ? d1D : linDepth(uvq - ky);
        if (folSil) {
          // Silhouette mode: leaf-on-leaf depth jumps don't count, only leaves against
          // terrain / sky. Without this every dither hole would get an outline.
          if (k == 1) { dR = mix(dR, d, step(qR.a, 0.02)); dL = mix(dL, d, step(qL.a, 0.02)); dU = mix(dU, d, step(qU.a, 0.02)); dD = mix(dD, d, step(qD.a, 0.02)); }
          else { dR = mix(dR, d, isFol(uvq + kx)); dL = mix(dL, d, isFol(uvq - kx)); dU = mix(dU, d, isFol(uvq + ky)); dD = mix(dD, d, isFol(uvq - ky)); }
        }
        outer = max(outer, max(outerAxis(d, dR, dL, thr), outerAxis(d, dU, dD, thr)));
      }
      float innerFade = clamp(1.6 - tw * 4.0, 0.0, 1.0);   // creases fade out when voxels get tiny on screen
      if (fol > 0.5) { inner = 0.0; if (uFolOutline < 0.5) outer = 0.0; }
      if (outer > 0.5) {
        col = mix(col, uOutlineColor, uOuter);
      } else if (inner > uNormalThr) {
        float k = uInner * innerFade;
        if (k >= 0.0) col = mix(col, uOutlineColor, k);                                // ink crease
        else col = mix(col, min(col * 1.5 + 0.06, vec3(1.0)), -k);                     // highlight crease
      }
    }

    // --- Colour grade ---
    col = (col - 0.5) * uContrast + 0.5;
    col *= uBright;
    float l = dot(col, vec3(0.299, 0.587, 0.114));
    col = clamp(mix(vec3(l), col, uSat), 0.0, 1.0);

    // --- Duotone ---
    if (uToneMix > 0.0) {
      float lt = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, mix(uToneA, uToneB, lt), uToneMix);
    }

    // --- Ink cross-hatching: line sets switch on as luminance drops ---
    if (uHatch > 0.0) {
      float lh = dot(col, vec3(0.299, 0.587, 0.114));
      float ink = 0.0;
      if (lh < 0.72 && mod(wp.x + wp.y, 4.0) < 1.0) ink = 1.0;
      if (lh < 0.48 && mod(wp.x - wp.y, 4.0) < 1.0) ink = 1.0;
      if (lh < 0.28 && mod(wp.y, 2.0) < 1.0) ink = 1.0;
      if (lh < 0.12) ink = 1.0;
      vec3 drawn = mix(uPaper, uOutlineColor, ink);
      col = mix(col, drawn * mix(vec3(1.0), col / max(lh, 0.05), 0.15), uHatch);
    }

    // --- Film / paper grain ---
    if (uGrain > 0.0) {
      vec2 gp = wp + (uGrainAnim > 0.5 ? floor(uTime * 12.0) * vec2(37.0, 91.0) : vec2(0.0));
      col += (hash2(gp) - 0.5) * uGrain * 0.22;
      col = clamp(col, 0.0, 1.0);
    }

    // --- Ordered dither + palette quantisation ---
    if (uPaletteOn > 0.5) {
      vec2 p = floor(gl_FragCoord.xy) + uDitherOffset;
      float b = uBayer < 3.0 ? bayer2(p) : (uBayer < 6.0 ? bayer4(p) : bayer8(p));
      b -= 0.5 * (1.0 - 1.0 / (uBayer * uBayer));      // centre around zero
      vec3 c = clamp(col + b * uDither * uSpread, 0.0, 1.0);
      col = texture(uPalLUT, c * (31.0 / 32.0) + 0.5 / 32.0).rgb;   // one lookup instead of a 64-colour search
    }
    gl_FragColor = vec4(col, 1.0);
  }

<script type="x-shader/x-fragment" id="upscale-fs">
  // Screen-res pass: nearest upscale of the finished pixel art, with
  //  - sub-texel camera compensation (from pixel snapping),
  //  - MAGNIFICATION: past the ASCII zoom threshold the art is rendered at a fixed
  //    resolution and this pass enlarges it, so zooming makes pixels bigger instead
  //    of adding detail,
  //  - ASCII: once an art pixel is big enough on screen, it is drawn as ONE character
  //    (chosen by that pixel's brightness and material) in that pixel's colour,
  //  - optional CRT + vignette.
  uniform sampler2D tPost, tNormal, tDepth, tGlyphs;
  uniform vec2  uLowRes;   // low-res target size (includes 1 texel margin on each side)
  uniform float uPS;       // screen pixels per low-res texel (before magnification)
  uniform float uMag;      // magnification (1 = none)
  uniform vec2  uHalf;     // half the visible size in texels (screen / uPS / 2)
  uniform vec2  uSub;      // leftover sub-texel camera offset from snapping
  uniform vec2  uScreen;   // screen size in pixels
  uniform float uCRT;      // CRT: curvature, scanlines, aperture grille, colour fringing
  uniform float uVignette;
  uniform float uGlyphAmt; // 0..1 share of pixels drawn as characters
  uniform vec2  uOffFull;  // whole-texel camera offset (world-locks the per-pixel random order)
  uniform float uGamma, uInvert, uColorAmt, uBgTint, uBoost, uEdgesOn, uEdgeThr, uMaterials, uTime;
  uniform float uNear, uFar, uOrtho;
  uniform float uMatch;    // 0 = stylised colours, 1 = each character cell averages to exactly the pixel's brightness
  uniform float uSoft;     // 0 = hard random dissolve, 1 = pure crossfade
  uniform float uStyle;    // 0 = brightness ramps per material, 1 = object symbols (Dwarf Fortress style)
  uniform float uDwarfPri; // 1 = cells containing a visible dwarf always show ☺
  uniform vec4  uDwarf[8]; // per dwarf: xy = art-pixel coords of its centre, z = view depth, w = 1 if on screen
  uniform vec3  uDwarfCol[8];
  uniform vec3  uMono, uBgColor;

  float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
  vec3 tap(vec2 t){ return texture2D(tPost, (floor(t) + 0.5) / uLowRes).rgb; }
  float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float lin(float d){
    if (uOrtho > 0.5) return uNear + d * (uFar - uNear);
    float z = d * 2.0 - 1.0;
    return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear));
  }

  // One art pixel -> one character. t = art-pixel coordinate (cell = floor, glyph uv = fract).
  vec3 asciiPixel(vec2 t, vec3 c){
    vec2 cell = floor(t);
    // Per-pixel reveal: each pixel has its own threshold h; uSoft widens the window so
    // pixels fade instead of popping (1 = every pixel crossfades together).
    float h = h21(cell + uOffFull) * (1.0 - uSoft);
    float k = smoothstep(h, h + uSoft + 1e-4, uGlyphAmt);
    if (k <= 0.0) return c;
    vec2 px = 1.0 / uLowRes, uv = (cell + 0.5) * px;
    float dRaw = texture2D(tDepth, uv).r;
    float a = texture2D(tNormal, uv).a;
    // Material ID (normal alpha): ~0 foliage (species 1-4 / 255), (type+1)*8/255 terrain,
    // 255/250/245/240 = generic prop / dwarf / tree trunk / torch.
    // Ramp style rows: 0-19 types, 20 foliage, 21 props, 22 sky, 23 edges.
    // Object style rows: 24-43 types, 44-47 oak/pine/birch/bush, 48-51 prop/dwarf/trunk/torch, 52 sky.
    float row, orow;
    if (dRaw >= 0.99999)  { row = 22.0; orow = 52.0; }
    else if (a < 0.02)    { row = 20.0; orow = 44.0 + clamp(floor(a * 255.0 + 0.5) - 1.0, 0.0, 3.0); }
    else if (a > 0.9)     { row = 21.0; orow = 48.0 + clamp(floor((255.0 - a * 255.0) / 5.0 + 0.5), 0.0, 3.0); }
    else { row = clamp(floor(a * 255.0 / 8.0 + 0.5) - 1.0, 0.0, 19.0); orow = 24.0 + row; }
    if (uMaterials < 0.5) row = dRaw >= 0.99999 ? 22.0 : 0.0;
    float lum = dot(c, vec3(0.299, 0.587, 0.114));
    float lt = uInvert > 0.5 ? 1.0 - lum : lum;
    float lv = clamp(floor(pow(clamp(lt, 0.0, 1.0), uGamma) * 8.0), 0.0, 7.0);
    bool water = abs(row - 11.0) < 0.5;
    if (water)                                                       // water characters ripple
      lv = clamp(lv + floor(h21(cell + uOffFull + floor(uTime * 3.0 + (cell.x + uOffFull.x) * 0.13)) * 3.0) - 1.0, 1.0, 7.0);
    if (uStyle > 0.5) {
      // Object style: the symbol belongs to the object, chosen by world position (brightness
      // is carried by colour), so a tree stays a tree from every side.
      row = orow;
      lv = floor(h21(cell + uOffFull + orow * 7.31 + (water ? floor(uTime * 2.0) * 3.7 : 0.0)) * 8.0);
    }
    bool edge = false;
    if (uStyle < 0.5 && uEdgesOn > 0.5 && dRaw < 0.99999) {                          // silhouette pixels become edge strokes (| / - and backslash)
      float dc = lin(dRaw);
      float dl = lin(texture2D(tDepth, uv - vec2(px.x, 0.0)).r), dr = lin(texture2D(tDepth, uv + vec2(px.x, 0.0)).r);
      float dd = lin(texture2D(tDepth, uv - vec2(0.0, px.y)).r), du = lin(texture2D(tDepth, uv + vec2(0.0, px.y)).r);
      float lx = abs(dr + dl - 2.0 * dc), ly = abs(du + dd - 2.0 * dc);
      float thr = uEdgeThr * (uOrtho > 0.5 ? 1.0 : max(dc, 1.0) * 0.015);
      if (max(lx, ly) > thr) {
        edge = true; row = 23.0;
        float gx = dr - dl, gy = du - dd;
        if (lx > ly * 2.0) lv = 0.0; else if (ly > lx * 2.0) lv = 2.0; else lv = (gx * gy > 0.0) ? 3.0 : 1.0;
      }
    }
    // Dwarf priority: a character cell that contains a visible dwarf always shows ☺ in that
    // dwarf's colour, even when the dwarf is smaller than the cell and the low-res render
    // missed it. Hidden if the scene at that cell is clearly in front of the dwarf.
    bool dwarf = false; vec3 dcol = vec3(0.0);
    if (uDwarfPri > 0.5) {
      float sceneD = dRaw >= 0.99999 ? 1e9 : lin(dRaw);
      for (int i = 0; i < 8; i++) {
        vec4 dw = uDwarf[i];
        if (dw.w > 0.5 && floor(dw.x) == cell.x && floor(dw.y) == cell.y && dw.z < sceneD + 1.2) { dwarf = true; dcol = uDwarfCol[i]; }
      }
      if (dwarf) { row = 49.0; lv = 0.0; edge = false; }
    }
    // Glyph coverage from a mip-mapped atlas: when a character is only a few screen px
    // its strokes average to the glyph's coverage instead of aliasing, so a small character
    // blends to one flat colour and larger ones resolve into crisp strokes.
    vec2 atlas = vec2(64.0, 424.0);
    float pps = uPS * uMag;
    float lod = clamp(log2(8.0 / pps), 0.0, 3.0);
    vec2 f = fract(t);
    float on  = textureLod(tGlyphs, (vec2(lv, row) * 8.0 + f * 8.0) / atlas, lod).r;
    float cov = textureLod(tGlyphs, (vec2(lv, row) * 8.0 + 4.0) / atlas, 3.0).r;   // whole-glyph ink coverage
    // Stylised colours...
    vec3 G = mix(uMono, c * uBoost, uColorAmt) * (edge ? 1.15 : 1.0);
    vec3 B = uBgColor + c * uBgTint;
    // ...and the exact-brightness solution: keep their hues, scale them so
    // cov*luma(G) + (1-cov)*luma(B) == luma(c). Glyph first; if it would exceed white,
    // clip it and lift the background instead.
    float lc = luma(c), lg = max(luma(G), 1e-4), lb = luma(B);
    vec3 Ge = G * clamp((lc - (1.0 - cov) * lb) / max(cov * lg, 1e-4), 0.0, 64.0);
    float mx = max(max(Ge.r, Ge.g), Ge.b);
    if (mx > 1.0) Ge /= mx;
    float need = (lc - cov * luma(Ge)) / max(1.0 - cov, 1e-4);
    vec3 Be = lb > 1e-3 ? B * clamp(need / lb, 0.0, 64.0) : c * clamp(need / max(lc, 1e-4), 0.0, 64.0);
    G = mix(G, Ge, uMatch); B = mix(B, clamp(Be, 0.0, 1.0), uMatch);
    if (dwarf) { G = min(dcol * 1.35 + 0.08, vec3(1.0)); B = c * 0.35; }   // dwarfs stand out, like in DF
    return mix(c, mix(B, G, on), k);
  }

  void main(){
    vec2 frag = gl_FragCoord.xy;
    vec2 sp = frag / uScreen;
    if (uCRT > 0.0) {                                   // barrel curvature
      vec2 c = sp * 2.0 - 1.0;
      c *= 1.0 + uCRT * 0.07 * dot(c, c);
      sp = c * 0.5 + 0.5;
      if (any(lessThan(sp, vec2(0.0))) || any(greaterThan(sp, vec2(1.0)))) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
      frag = sp * uScreen;
    }
    float pps = uPS * uMag;                             // screen px per art pixel after magnification
    vec2 t = 1.0 + uHalf + (frag - uScreen * 0.5) / pps + uSub;
    vec3 col;
    if (uCRT > 0.0 && uGlyphAmt <= 0.0) {
      float ca = uCRT * 0.8 / pps;                      // ~1 screen px of colour fringing
      col = vec3(tap(t + vec2(ca, 0.0)).r, tap(t).g, tap(t - vec2(ca, 0.0)).b);
    } else {
      col = tap(t);
    }
    if (uGlyphAmt > 0.0) col = asciiPixel(t, col);
    if (uCRT > 0.0) {
      float scan = mix(1.0, 0.45 + 0.55 * sin(fract(t.y) * 3.14159), uCRT * (1.0 - uGlyphAmt));   // one scanline per art row
      float m = mod(floor(frag.x), 3.0);
      vec3 mask = mix(vec3(1.0), vec3(m < 0.5 ? 1.0 : 0.72, abs(m - 1.0) < 0.5 ? 1.0 : 0.72, m > 1.5 ? 1.0 : 0.72), uCRT * 0.6);
      vec3 glow = (tap(t + vec2(1.0, 0.0)) + tap(t - vec2(1.0, 0.0)) + tap(t + vec2(0.0, 1.0)) + tap(t - vec2(0.0, 1.0))) * 0.25;
      col = (col * scan * mask + glow * 0.18 * uCRT) * (1.0 + 0.3 * uCRT);
    }
    if (uVignette > 0.0) {
      vec2 c = sp * 2.0 - 1.0;
      col *= mix(1.0, smoothstep(1.45, 0.35, length(c * vec2(1.0, 0.85))), uVignette);
    }
    gl_FragColor = vec4(col, 1.0);
  }
</script>

/* =====================================================================
   VOXEL WORLD  (32 x 24 x 32)
   ===================================================================== */
const SX = 64, SY = 40, SZ = 64;
const GY = 10;   // vertical offset: surface sits ~26, leaving a deep cross-section below
const T = { AIR:0, GRASS:1, DIRT:2, PATH:3, STONE:4, DEEP:5, COPPER:6, GOLD:7, IRON:8, WOOD:9, LEAVES:10,
            WATER:11, ROCK:12, BUSH:13, PLANK:14, BRICK:15, EMBER:16, SAND:17, METAL:18, CRYSTAL:19 };
// [colour, class, emissive]   class: 0 generic, 1 water, 2 prop, 3 grass, 4 ore
const MAT = [];
MAT[T.GRASS]=['#6f9a3a',3,0]; MAT[T.DIRT]=['#8a5a34',0,0]; MAT[T.PATH]=['#b48a58',0,0];
MAT[T.STONE]=['#77706a',0,0]; MAT[T.DEEP]=['#4d4650',0,0]; MAT[T.COPPER]=['#d0783a',4,0];
MAT[T.GOLD]=['#f0c440',4,0]; MAT[T.IRON]=['#c89a8a',4,0]; MAT[T.WOOD]=['#6a4428',0,0];
MAT[T.LEAVES]=['#4f7a32',0,0]; MAT[T.WATER]=['#4f86a0',1,0]; MAT[T.ROCK]=['#8a8378',0,0];
MAT[T.BUSH]=['#5e8a34',0,0]; MAT[T.PLANK]=['#a8763c',0,0]; MAT[T.BRICK]=['#8a3c2a',0,0];
MAT[T.EMBER]=['#ff8a2a',2,1]; MAT[T.SAND]=['#d8c08a',0,0]; MAT[T.METAL]=['#46424a',2,0];
MAT[T.CRYSTAL]=['#7fe0d8',2,1];
const MATRGB = MAT.map(m => m ? hex(m[0]) : null);

const vox = new Uint8Array(SX*SY*SZ);
const I = (x,y,z) => x + SX*(z + SZ*y);
const inb = (x,y,z) => x>=0 && y>=0 && z>=0 && x<SX && y<SY && z<SZ;
const get = (x,y,z) => inb(x,y,z) ? vox[I(x,y,z)] : 0;
const set = (x,y,z,t) => { if (inb(x,y,z)) vox[I(x,y,z)] = t; };

function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const rng = mulberry32(1337);
function h2(x,z,s){ let h = Math.imul(x|0,374761393) ^ Math.imul(z|0,668265263) ^ Math.imul(s,1442695041);
  h = Math.imul(h ^ (h>>>13), 1274126177); h ^= h>>>16; return (h>>>0)/4294967296; }
function vnoise(x,z,s){ const xi=Math.floor(x), zi=Math.floor(z); let xf=x-xi, zf=z-zi;
  xf=xf*xf*(3-2*xf); zf=zf*zf*(3-2*zf);
  const a=h2(xi,zi,s), b=h2(xi+1,zi,s), c=h2(xi,zi+1,s), d=h2(xi+1,zi+1,s);
  return a + (b-a)*xf + (c-a)*zf + (a-b-c+d)*xf*zf; }

// --- Layout (voxel x,z) -------------------------------------------------------------
const PATH_PTS = [[55,57],[50,46],[47,37],[30,35],[24,22],[13,15],[3,5]];
function distToPath(px,pz){

  const n=g.attributes.position.count, c=hex(color), C=new Float32Array(n*3), A=new Float32Array(n*4);
  for (let i=0;i<n;i++){ C.set(c,i*3); A.set([1,1,emissive,cls],i*4); }
  g.setAttribute('aColor', new THREE.BufferAttribute(C,3)); g.setAttribute('aAux', new THREE.BufferAttribute(A,4));
  return g;
}

/* =====================================================================
   FOLIAGE: trees & bushes as simple low-poly models (not voxels).
   Canopies are jittered icosphere blobs (outer shell + darker inner core) or cones,
   plus an optional set of leaf cards. All share the foliage shader, whose look is
   driven by the Foliage panel / presets.
   ===================================================================== */
const FOL_U = { uFolMode:{value:0}, uDensity:{value:0.7}, uLeafSize:{value:0.2}, uEdgeFade:{value:0.55},
  uScreenMix:{value:0.35}, uSphere:{value:0.85}, uTransl:{value:0.5}, uInnerDark:{value:0.6}, uHueVar:{value:0.5},
  uSway:{value:0.35}, uScreenOffset:{value:new THREE.Vector2()} };
function foliageMaterial(pass, side=THREE.FrontSide, mrt=false){
  const defines = { ['PASS_'+pass]:'' }; if (mrt) defines.MRT = '';
  return new THREE.ShaderMaterial({ uniforms:{ ...U, ...FOL_U, uObjExposure:{value:1} }, defines, side,
    colorWrite: pass!=='DEPTH', vertexShader:src('foliage-vs'),
    fragmentShader:(mrt ? MRT_HEAD : '')+src('toon-common')+src('foliage-fs'), ...(mrt ? { glslVersion:THREE.GLSL3 } : {}) });
}
const foliagePre = side => { const m = foliageMaterial('NORMAL', side); m.colorWrite = false; return m; };  // same discard as colour
const foliagePasses = side => ({ color:foliageMaterial('COLOR',side), colorMRT:foliageMaterial('COLOR',side,true),
  normal:foliageMaterial('NORMAL',side), depth:foliageMaterial('DEPTH',side), pre:foliagePre(side) });

// Procedural placement: keep clear of the path, water, the workshop plateau and each other.
const TREES = [], BUSHES = [];   // [x, z, species, scale] / [x, z, scale]
(function placePlants(){
  const r = mulberry32(2024);
  const clear = (x, z, pad) => distToPath(x+0.5, z+0.5) > pad + 1.6
    && Math.hypot(x+0.5-POND.x, z+0.5-POND.z) > POND.r + pad
    && !(z < POND.z && Math.abs(x+0.5-streamX(z)) < pad + 1.5)
    && !(x >= 26 && z >= 44) && get(x, surfTop(x,z), z) !== T.WATER;
  for (let tries=0; tries<900 && TREES.length<26; tries++){
    const x = 2 + Math.floor(r()*(SX-4)), z = 2 + Math.floor(r()*(SZ-4));
    if (!clear(x, z, 2.5) || TREES.some(t => Math.hypot(t[0]-x, t[1]-z) < 6.5)) continue;
    const q = r(), sp = q < 0.45 ? 'oak' : q < 0.8 ? 'pine' : 'birch';
    TREES.push([x, z, sp, 0.7 + r()*0.7]);
  }
  for (let tries=0; tries<900 && BUSHES.length<24; tries++){
    const x = 2 + Math.floor(r()*(SX-4)), z = 2 + Math.floor(r()*(SZ-4));
    if (!clear(x, z, 1) || TREES.some(t => Math.hypot(t[0]-x, t[1]-z) < 3) || BUSHES.some(b => Math.hypot(b[0]-x, b[1]-z) < 3.5)) continue;
    BUSHES.push([x, z, 0.7 + r()*0.5]);
  }
})();
const SPECIES = {
  oak:   { bark:'#6a4428', leaf:'#5f8a32' },
  pine:  { bark:'#5a3a24', leaf:'#3f6c3a' },
  birch: { bark:'#d8cfbc', leaf:'#8aa640' },
  bush:  { bark:'#5a3a24', leaf:'#5e8a34' },
};
const jhash = (x,y,z) => { const v = Math.sin(x*127.1 + y*311.7 + z*74.7) * 43758.5453; return v - Math.floor(v); };

// Give a foliage geometry the attributes the foliage shader expects.
function foliageAttrs(g, color, sphereC, layer, baseY, height, card, seed, sphereSquash=1){
  const p=g.attributes.position, n=p.count, C=new Float32Array(n*3), Sph=new Float32Array(n*3), A=new Float32Array(n*4);
  for (let i=0;i<n;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const v=new THREE.Vector3(x-sphereC.x, (y-sphereC.y)*sphereSquash, z-sphereC.z).normalize();
    C.set(color,i*3); Sph.set([v.x,v.y,v.z],i*3);
    A.set([layer, Math.min(1, Math.max(0, (y-baseY)/height)), card, seed], i*4);
  }
  g.setAttribute('aColor',new THREE.BufferAttribute(C,3)); g.setAttribute('aSphere',new THREE.BufferAttribute(Sph,3));
  g.setAttribute('aAux',new THREE.BufferAttribute(A,4));
  return g;
}
// Lumpy low-poly blob: icosphere with deterministic per-vertex radial jitter, flat-shaded.
function blobGeo(c, r, squashY, seed){
  const g = new THREE.IcosahedronGeometry(r, 1), p = g.attributes.position;   // non-indexed
  for (let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const k = 1 + (jhash(Math.round(x*100)+seed, Math.round(y*100), Math.round(z*100)) - 0.5) * 0.32;
    p.setXYZ(i, x*k, y*k*squashY, z*k);
  }
  g.computeVertexNormals(); g.translate(c.x, c.y, c.z);
  return g;
}
function coneGeo(c, r, h, seed){
  const g = new THREE.ConeGeometry(r, h, 7, 2).toNonIndexed(), p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const k = 1 + (jhash(Math.round(x*100)+seed, Math.round(y*100), Math.round(z*100)) - 0.5) * 0.22;
    p.setXYZ(i, x*k, y, z*k);
  }
  g.computeVertexNormals(); g.translate(c.x, c.y, c.z);
  return g;
}
// Cards: small quads scattered over a blob's surface, facing roughly outward.
function cardGeos(c, r, squashY, size, seed, rand){
  const out=[], count=Math.round(18*r*r);
  for (let k=0;k<count;k++){
    const dir = new THREE.Vector3(rand()*2-1, rand()*2-1, rand()*2-1).normalize();
    const pos = c.clone().add(new THREE.Vector3(dir.x, dir.y*squashY, dir.z).multiplyScalar(r*(0.78+0.3*rand())));
    const nrm = dir.clone().add(new THREE.Vector3(rand()-0.5, rand()-0.5, rand()-0.5).multiplyScalar(1.2)).normalize();
    const g = new THREE.PlaneGeometry(size*0.7, size).toNonIndexed();
    g.rotateZ(rand()*Math.PI*2);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), nrm));
    g.translate(pos.x, pos.y, pos.z);
    out.push(g);
  }
  return out;
}
function cylinderBetween(a, b, r0, r1){
  const d=b.clone().sub(a), L=d.length();
  const g=new THREE.CylinderGeometry(r1, r0, L, 6, 1);
  g.translate(0, L/2, 0);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()));
  g.translate(a.x, a.y, a.z);
  return g;
}
function barkAttrs(g, color){
  g.deleteAttribute('uv');
  const n=g.attributes.position.count, c=hex(color), C=new Float32Array(n*3), A=new Float32Array(n*4);
  for (let i=0;i<n;i++){ C.set(c,i*3); A.set([1,1,0,2],i*4); }
  g.setAttribute('aColor',new THREE.BufferAttribute(C,3)); g.setAttribute('aAux',new THREE.BufferAttribute(A,4));
  return g;
}

function buildFoliage(cardSize){
  const rand = mulberry32(4242);
  const bark=[], outer=[], inner=[], cards=[];
  const plant = (x, z, species, s, seed) => {
    const seedW = ({ oak:0, pine:1, birch:2, bush:3 })[species] + seed;   // integer part = species (read by the ASCII object glyphs)
    const sp = SPECIES[species], tint = 0.9 + rand()*0.2;
    const leaf = hex(sp.leaf).map((v,i)=>v*tint*(i===0 ? 0.95+rand()*0.1 : 1));
    const base = new THREE.Vector3(x+0.5, surfTop(x,z)+0.85, z+0.5);
    const blobs = [];   // {c, r, sq, sphereC}
    const addBark = g => bark.push(barkAttrs(g, sp.bark));
    let H = 1, cones = false;
    if (species==='oak'){
      const h=3.0*s, top=base.clone().add(new THREE.Vector3(0,h,0));
      addBark(cylinderBetween(base, top, 0.32*s, 0.2*s));
      const C = top.clone().add(new THREE.Vector3(0,0.8*s,0));
      blobs.push({ c:top.clone().add(new THREE.Vector3(0,1.0*s,0)), r:1.8*s, sq:0.85, sphereC:C });
      const n = 3 + Math.floor(rand()*2);
      for (let i=0;i<n;i++){
        const a = seed*6.283 + i*6.283/n + rand()*0.6;
        const c = top.clone().add(new THREE.Vector3(Math.cos(a)*1.35*s, (rand()*0.7-0.15)*s, Math.sin(a)*1.35*s));
        blobs.push({ c, r:(1.05+rand()*0.4)*s, sq:0.85, sphereC:C });
        addBark(cylinderBetween(top.clone().add(new THREE.Vector3(0,-0.7*s,0)), c, 0.13*s, 0.07*s));
      }
      H = h + 2.8*s;
    } else if (species==='birch'){
      const h=3.8*s, top=base.clone().add(new THREE.Vector3(0,h,0));
      addBark(cylinderBetween(base, top, 0.17*s, 0.11*s));
      const C = top.clone().add(new THREE.Vector3(0,0.5*s,0));
      blobs.push({ c:top.clone().add(new THREE.Vector3(0,0.9*s,0)), r:1.15*s, sq:1.35, sphereC:C });
      blobs.push({ c:top.clone().add(new THREE.Vector3(0.5*s,-0.4*s,0.2*s)), r:0.9*s, sq:1.25, sphereC:C });
      blobs.push({ c:top.clone().add(new THREE.Vector3(-0.4*s,-0.1*s,-0.4*s)), r:0.85*s, sq:1.25, sphereC:C });
      H = h + 2.4*s;
    } else if (species==='pine'){
      const h=4.6*s, top=base.clone().add(new THREE.Vector3(0,h,0));
      addBark(cylinderBetween(base, top, 0.24*s, 0.1*s));
      cones = true;
      let y = 1.4*s;
      [[1.75,2.1],[1.35,1.9],[0.95,1.7],[0.55,1.3]].forEach(([r,hh],i) => {
        const c = base.clone().add(new THREE.Vector3(0, y + hh*s/2, 0));
        blobs.push({ c, r:r*s, h:hh*s, sphereC:base.clone().add(new THREE.Vector3(0, y - 0.4*s, 0)) });
        y += hh*s*0.62;
      });
      H = y + 1.0*s;
    } else { // bush
      base.y = surfTop(x,z)+1;
      blobs.push({ c:base.clone().add(new THREE.Vector3(0,0.45*s,0)), r:0.75*s, sq:0.75, sphereC:base.clone() });
      if (rand()<0.7) blobs.push({ c:base.clone().add(new THREE.Vector3((rand()-0.5)*0.9*s,0.35*s,(rand()-0.5)*0.9*s)), r:0.55*s, sq:0.8, sphereC:base.clone() });
      H = 1.8*s;
    }
    for (const b of blobs){
      if (cones){
        outer.push(foliageAttrs(coneGeo(b.c, b.r, b.h, seed*97), leaf, b.sphereC, 0, base.y, H, 0, seedW, 0.6));
        inner.push(foliageAttrs(coneGeo(b.c, b.r*0.62, b.h*0.8, seed*53), leaf, b.sphereC, 1, base.y, H, 0, seedW, 0.6));
        for (const g of cardGeos(b.c.clone().add(new THREE.Vector3(0,-b.h*0.15,0)), b.r*0.8, b.h/b.r*0.4, cardSize*0.85, seed, rand))
          cards.push(foliageAttrs(g, leaf, b.sphereC, 0, base.y, H, 1, seedW, 0.6));
      } else {
        outer.push(foliageAttrs(blobGeo(b.c, b.r, b.sq, seed*97), leaf, b.sphereC, 0, base.y, H, 0, seedW));
        inner.push(foliageAttrs(blobGeo(b.c, b.r*0.66, b.sq, seed*53), leaf, b.sphereC, 1, base.y, H, 0, seedW));
        for (const g of cardGeos(b.c, b.r, b.sq, cardSize*Math.min(1, 0.6+s*0.4), seed, rand))
          cards.push(foliageAttrs(g, leaf, b.sphereC, 0, base.y, H, 1, seedW));
      }
    }
  };
  TREES.forEach(([x,z,sp,s],i) => plant(x, z, sp, s, (i+1)*0.137 % 1));
  BUSHES.forEach(([x,z,s],i) => plant(x, z, 'bush', s, (i+3)*0.291 % 1));
  return { bark:mergeGeometries(bark), outer:mergeGeometries(outer), inner:mergeGeometries(inner), cards:mergeGeometries(cards) };
}

const folMeshes = {

  outer: new THREE.Mesh(new THREE.BufferGeometry()),

folMeshes.inner.userData.passes = foliagePasses(THREE.FrontSide);

// Visibility per technique: dithered = shell + core, solid = shell, cards = cards + core.
function applyFoliage(){
  const mode = +S.folMode;
  FOL_U.uFolMode.value=mode; FOL_U.uDensity.value=S.density; FOL_U.uLeafSize.value=S.leafSize; FOL_U.uEdgeFade.value=S.edgeFade;
  FOL_U.uScreenMix.value=S.screenMix; FOL_U.uSphere.value=S.sphere; FOL_U.uTransl.value=S.transl;
  FOL_U.uInnerDark.value=S.innerDark; FOL_U.uHueVar.value=S.hueVar; FOL_U.uSway.value=S.sway;
  folMeshes.outer.visible = mode!==2; folMeshes.inner.visible = mode!==1; folMeshes.cards.visible = mode===2;
  postMat.uniforms.uFolOutline.value = +S.folOutline;
  updateTriCount();
}

/* Render passes swap materials per mesh (instead of scene.overrideMaterial) so foliage
   can keep its dither/alpha cut-outs in the normal and shadow passes. */
let passMeshes = [], currentPass = 'color';
function registerPasses(){
  scene.traverse(o => { if (o.isMesh && !o.userData.passes)
    o.userData.passes = { color:o.material, colorMRT:o.material.userData.mrt || o.material, normal:normalMatFor(Math.round((o.material.uniforms?.uObjAlpha?.value ?? 1)*255)), depth:depthOnlyMat, pre:toonPreMat }; });
  passMeshes = []; scene.traverse(o => { if (o.isMesh && o.userData.passes) passMeshes.push(o); });
}
function setPass(pass){
  if (pass === currentPass) return;
  for (const o of passMeshes) o.material = o.userData.passes[pass];
  currentPass = pass;
}

/* Dwarfs: blocky figures with swinging legs/arms walking ping-pong along waypoints. */
class Dwarf {
  constructor(path, tunic, beard, hat, speed=1.1, work=false){
    this.tunicRGB = hex(tunic);
    this.path = path.map(p => new THREE.Vector3(...p));
    this.cum=[0]; for (let i=1;i<this.path.length;i++) this.cum.push(this.cum[i-1]+this.path[i].distanceTo(this.path[i-1]));
    this.len=this.cum[this.cum.length-1]; this.s=rng()*this.len; this.dir=1; this.pause=0; this.speed=speed; this.work=work;
    this.phase=rng()*6; this.yaw=0; this.mat=toonMaterial(1, OBJ_ID.dwarf);
    const skin='#e8b48a', pants='#4a3428';
    this.root=new THREE.Group();
    this.body=new THREE.Mesh(mergeGeometries([
      box(0.5,0.5,0.38, 0,0.6,0, tunic), box(0.52,0.07,0.4, 0,0.5,0, '#3a2418'),
      box(0.36,0.36,0.36, 0,1.03,0, skin), box(0.38,0.34,0.12, 0,0.86,0.2, beard), box(0.08,0.08,0.06, 0,1.02,0.21, '#d89a74'),
      box(0.4,0.12,0.4, 0,1.27,0, hat), box(0.24,0.16,0.24, 0,1.4,-0.03, hat) ]), this.mat);
    const limb = (w,h,d,c,x,y) => { const m=new THREE.Mesh(box(w,h,d, 0,-h/2,0, c), this.mat); m.position.set(x,y,0); return m; };
    this.legL=limb(0.18,0.35,0.2,pants,-0.11,0.35); this.legR=limb(0.18,0.35,0.2,pants,0.11,0.35);
    this.armL=limb(0.12,0.4,0.14,tunic,-0.31,0.82); this.armR=limb(0.12,0.4,0.14,tunic,0.31,0.82);
    this.root.add(this.body,this.legL,this.legR,this.armL,this.armR);
    chunk.add(this.root);
  }
  sample(s){
    let i=1; while (i<this.cum.length-1 && this.cum[i]<s) i++;
    const a=this.path[i-1], b=this.path[i], t=(s-this.cum[i-1])/Math.max(1e-6,this.cum[i]-this.cum[i-1]);
    return { p:a.clone().lerp(b,Math.min(1,Math.max(0,t))), d:b.clone().sub(a) };
  }
  update(dt, time){
    let moving = false;
    if (this.pause>0) this.pause-=dt;
    else {
      this.s += this.dir*this.speed*dt; moving=true;
      if (this.s>=this.len){ this.s=this.len; this.dir=-1; this.pause=this.work?4:1.2+rng()*1.5; }
      if (this.s<=0){ this.s=0; this.dir=1; this.pause=this.work?3:1.2+rng()*1.5; }
    }
    const {p,d} = this.sample(Math.min(this.len-1e-4, Math.max(1e-4,this.s)));
    // Face the direction of travel; while paused, keep facing the way we arrived
    // (path ends are authored so that means facing the bench / forge).
    if (moving){
      const target=Math.atan2(d.x*this.dir, d.z*this.dir);
      let dy=target-this.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); this.yaw+=dy*Math.min(1,dt*8);
    }
    this.root.position.copy(p); this.root.rotation.y=this.yaw;
    if (moving) this.phase += dt*this.speed*7;
    const sw = moving ? Math.sin(this.phase)*0.6 : 0;
    this.legL.rotation.x=sw; this.legR.rotation.x=-sw; this.armL.rotation.x=-sw*0.8; this.armR.rotation.x=sw*0.8;
    if (!moving && this.work) this.armR.rotation.x = -1.2 - Math.abs(Math.sin(time*5))*0.9;  // hammering
    this.body.position.y = moving ? Math.abs(Math.sin(this.phase))*0.05 : 0;
    this.mat.uniforms.uObjExposure.value = lightAt(Math.floor(p.x), Math.floor(p.y+0.8), Math.floor(p.z));
  }
}
// Surface walker: sample the path densely and follow the terrain height.
const surfacePath = [];
for (let i=0;i<PATH_PTS.length-1;i++){
  const [ax,az]=PATH_PTS[i], [bx,bz]=PATH_PTS[i+1], n=Math.ceil(Math.hypot(bx-ax,bz-az)*2);
  for (let k=0;k<n;k++){ const t=k/n, x=lerp(ax,bx,t), z=lerp(az,bz,t); surfacePath.push([x, surfTop(Math.floor(x),Math.floor(z))+1, z]); }
}
// Pond-side wanderer: a loop around the pond at ground height.
const pondPath = [];
for (let k=0;k<=48;k++){ const a = k/48*Math.PI*2, x = POND.x + Math.cos(a)*(POND.r+2.6), z = POND.z + Math.sin(a)*(POND.r+2.6);
  if (inStream(Math.floor(x), Math.floor(z))) continue; pondPath.push([x, surfTop(Math.floor(x),Math.floor(z))+1, z]); }
// Cavern explorer: along the cave floor near the open face.
const cavePath = [];
for (let x=10; x<=23; x++){ const z = 60, y = caveFloor(x, z); if (y !== null) cavePath.push([x+0.5, y, z+0.5]); }
const dwarfs = [

  new Dwarf([[44.5,GY+17,62.6],[34.5,GY+7,62.6],[29.5,GY+7,62.6]], '#3a6a8a', '#6a4a30', '#8a2a20', 1.1),

function resize(){

  // and let the pixel-size slider step by exactly one screen pixel.
  // "Auto": on very dense phone screens (>2x) render at 1x and let the browser
  // integer-scale the canvas (crisp with image-rendering: pixelated); this cuts the
  // screen-res work ~9x. Otherwise use the native ratio (capped at 3).

  const stepPx = 1/Math.max(1, Math.round(dpr));
  if (inputs.pixel){ inputs.pixel.step = stepPx; inputs.pixel.value = S.pixel; if (valEls.pixel) valEls.pixel.textContent = fmtVal('pixel'); }

  sub.set(0,0); doff.set(0,0); offFull.set(0,0);
  if (S.snap){
    // Snap the camera to whole texels in its own right/up plane; hand the remainder to the upscale pass.
    tmpR.setFromMatrixColumn(R.matrixWorld,0); tmpU.setFromMatrixColumn(R.matrixWorld,1);
    const pr = R.position.dot(tmpR)/wpt, pu = R.position.dot(tmpU)/wpt, sr = Math.round(pr), su = Math.round(pu);
    R.position.addScaledVector(tmpR,(sr-pr)*wpt).addScaledVector(tmpU,(su-pu)*wpt); R.updateMatrixWorld();
    sub.set(pr-sr, pu-su); doff.set(mod(sr,8), mod(su,8)); offFull.set(mod(sr,4096), mod(su,4096));
  }
  FOL_U.uScreenOffset.value.copy(doff);
  // Frustum in texels, with the visible area centred on the camera and 1 texel of margin.
  const l=-(1+vw/2), r=rw-1-vw/2, b=-(1+vh/2), t=rh-1-vh/2;
  if (S.ortho) R.projectionMatrix.makeOrthographic(l*wpt, r*wpt, t*wpt, b*wpt, L.near, L.far);
  else { const k = wpt*L.near/dist; R.projectionMatrix.makePerspective(l*k, r*k, t*k, b*k, L.near, L.far); }
  R.projectionMatrixInverse.copy(R.projectionMatrix).invert();
  postMat.uniforms.uNear.value=L.near; postMat.uniforms.uFar.value=L.far; postMat.uniforms.uOrtho.value=+S.ortho;
  postMat.uniforms.uTexelWorld.value = S.ortho ? wpt : wpt/dist;
  postMat.uniforms.uFogRef.value = dist; postMat.uniforms.uFogColor.value.set(...skyColor);
  // Characters fade in (pixel by pixel, random order) as magnified pixels reach the
  // character size on screen. 'Always' renders big pixels from the start.
  // Both transitions run over a zoom RANGE measured in log space, so the reveal advances
  // evenly per scroll step (~20 steps for a 3x range).
  const s01 = x => { x = Math.min(1, Math.max(0, x)); return x*x*(3-2*x); };
  const inK = (asciiIn && magnify > 1) ? Math.log(magnify) / Math.log(Math.max(1.05, S.asciiInLen)) : 0;
  asciiAmt = S.asciiMode === 'always' ? 1 : Math.max(s01(inK), s01(farK));
  farLite = farK > 0 && asciiAmt >= 0.999 && S.asciiFarLite;
  const u = upMat.uniforms;
  u.uMag.value = magnify; u.uGlyphAmt.value = asciiAmt;
  u.uStyle.value = ((farK > 0 ? S.asciiFarStyle : S.asciiNearStyle) === 'object') ? 1 : 0;
  // Dwarf priority (zoomed-out view, or any object-symbol view): project each dwarf's centre
  // into the art-pixel grid of this frame's render camera.
  u.uDwarfPri.value = (S.asciiDwarfPri && (farK > 0 || u.uStyle.value > 0.5)) ? 1 : 0;
  if (u.uDwarfPri.value > 0){
    R.updateMatrixWorld();
    for (let i=0;i<8;i++){
      const slot = u.uDwarf.value[i]; slot.set(0,0,0,0);
      const dw = dwarfs[i]; if (!dw) continue;
      dw.root.updateWorldMatrix(true, false);
      tmpP.set(0, 0.75, 0); dw.root.localToWorld(tmpP);
      const depth = -tmpQ.copy(tmpP).applyMatrix4(R.matrixWorldInverse).z;
      tmpP.project(R);
      if (depth <= 0 || Math.abs(tmpP.x) > 1 || Math.abs(tmpP.y) > 1) continue;
      slot.set((tmpP.x*0.5+0.5)*rw, (tmpP.y*0.5+0.5)*rh, depth, 1);
      u.uDwarfCol.value[i].set(...dw.tunicRGB);
    }
  }
  u.uPS.value = psF; u.uHalf.value.set(W/psF/2, H/psF/2);
  u.uNear.value = L.near; u.uFar.value = L.far; u.uOrtho.value = +S.ortho;
  return R;
}

/* ---------------------------------------------------------------------
   PROFILER: GPU time per pass via EXT_disjoint_timer_query_webgl2 when the
   browser exposes it; otherwise a sync fallback (forces the GPU to finish after
   each pass with a 1-pixel read: accurate per pass, but lowers overall fps).
   --------------------------------------------------------------------- */
const gl = renderer.getContext();
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const gpuName = (() => { const e = gl.getExtension('WEBGL_debug_renderer_info');
  return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); })();
const prof = { avg:{}, pending:[], cur:null, t0:0, px:new Uint8Array(4) };
renderer.info.autoReset = false;
function passBegin(label){
  if (!S.profiler) return;
  if (timerExt){ const q = gl.createQuery(); gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q); prof.cur = { q, label }; }
  else { gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,prof.px); prof.cur = { label }; prof.t0 = performance.now(); }
}
function passEnd(){
  if (!S.profiler || !prof.cur) return;
  if (timerExt){ gl.endQuery(timerExt.TIME_ELAPSED_EXT); prof.pending.push(prof.cur); }
  else { gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,prof.px); profAdd(prof.cur.label, performance.now()-prof.t0); }
  prof.cur = null;
}
function profAdd(label, ms){ const a = prof.avg[label]; prof.avg[label] = a === undefined ? ms : a*0.92 + ms*0.08; }
function pollProfiler(){
  if (!timerExt) return;
  const disjoint = gl.getParameter(timerExt.GPU_DISJOINT_EXT);
  prof.pending = prof.pending.filter(p => {
    if (!gl.getQueryParameter(p.q, gl.QUERY_RESULT_AVAILABLE)) return true;
    if (!disjoint) profAdd(p.label, gl.getQueryParameter(p.q, gl.QUERY_RESULT)/1e6);
    gl.deleteQuery(p.q); return false;
  });
}
function drawProfiler(cpuMs){
  const lines = [];
  const soft = /swiftshader|llvmpipe|basic render|software/i.test(gpuName);
  const igpu = /intel|uhd|iris|adreno|mali|apple m|radeon\(tm\) graphics|vega \d+ graphics/i.test(gpuName);
  lines.push(`GPU  ${gpuName.replace(/^ANGLE \(|\)$/g,'').slice(0,64)}`);
  if (soft) lines.push('!! Software rendering — enable hardware acceleration in the browser');
  else if (igpu) lines.push('note: integrated GPU — on a laptop, set the browser to "High performance" GPU');
  lines.push(`canvas ${W}×${H} @${dpr}x · art ${rw-2}×${rh-2} (${((rw*rh)/1e6).toFixed(3)} Mpx/pass)`);
  lines.push(`draws ${renderer.info.render.calls} · tris ${(renderer.info.render.triangles/1000).toFixed(1)}k · CPU ${cpuMs.toFixed(2)}ms`);
  lines.push(`timing: ${timerExt ? 'GPU timer queries' : 'sync fallback (slows fps)'}`);
  let total = 0;
  for (const k of ['shadow','colour','normals','post','upscale']){
    const v = prof.avg[k]; if (v === undefined) continue; total += v;
    lines.push(`${k.padEnd(8)} ${v.toFixed(2).padStart(6)}ms ${'█'.repeat(Math.min(30, Math.round(v*3)))}`);
  }
  lines.push(`total    ${total.toFixed(2).padStart(6)}ms`);
  document.getElementById('prof').textContent = lines.join('\n');
}

let last=performance.now(), fpsT=0, fpsN=0, uiT=0, frameNo=0, lastShadowSun=null;
const clearCol = new THREE.Color();
const LIGHT_RGB = LIGHTS.map(Lt => hex(Lt.c));
LIGHTS.forEach((Lt,i) => { U.uPointPos.value[i].set(...Lt.p).add(CHUNK_ORIGIN); U.uPointRange.value[i]=Lt.r; });
const fpsEl=document.getElementById('fps');
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const time=now/1000; U.uTime.value=time; postMat.uniforms.uTime.value=time; upMat.uniforms.uTime.value=time;
  fpsN++; fpsT+=dt; if (fpsT>0.5){ fpsEl.textContent=`${Math.round(fpsN/fpsT)} (${(fpsT/fpsN*1000).toFixed(1)}ms)`; fpsN=0; fpsT=0; }
  frameNo++;
  const cpu0 = performance.now();
  renderer.info.reset(); pollProfiler();

  if (S.cycle){ S.sun=(S.sun+dt*6)%360; uiT+=dt; if (uiT>0.2){ refreshUI('sun'); uiT=0; } }
  updateSun();
  for (let i=0;i<LIGHTS.length;i++){
    const Lt=LIGHTS[i], c=LIGHT_RGB[i], k = Lt.k*(0.88 + 0.07*Math.sin(time*9.1+i*2.3) + 0.05*Math.sin(time*23.7+i));
    U.uPointCol.value[i].set(c[0]*k, c[1]*k, c[2]*k);
  }
  dwarfs.forEach(d=>d.update(dt,time));
  (S.ortho?ctrlO:ctrlP).update();
  const cam = setupRenderCamera();

  // 1. Sun shadow depth
  //    Re-rendered every N frames (only dwarfs and swaying leaves move), or at once
  //    when the sun moves or the scene changes.
  U.uShadowOn.value = (S.shadows && !farLite) ? 1 : 0;
  if (S.shadows && !farLite && (shadowDirty || S.sun !== lastShadowSun || frameNo % (+S.shadowEvery) === 0)){
    setPass('depth'); renderer.setRenderTarget(shadowRT); renderer.clear();
    passBegin('shadow'); renderer.render(scene, shadowCam); passEnd();
    shadowDirty = false; lastShadowSun = S.sun;
  }
  // 2. Low-res colour (+ depth texture)
  //    (combined mode writes colour + normals in this one pass)
  renderer.setRenderTarget(gbufRT || colorRT);
  renderer.setClearColor(clearCol.setRGB(skyColor[0], skyColor[1], skyColor[2]),1); renderer.clear();
  passBegin('colour');
  if (S.prepass){ setPass('pre'); renderer.render(scene, cam); }
  setPass(gbufRT ? 'colorMRT' : 'color'); renderer.render(scene, cam);
  passEnd();
  // 3. Low-res world normals (only the outline pass reads them, so skip when outlines are off)
  if ((S.outlineOn || asciiAmt > 0) && !gbufRT){   // ASCII also reads material IDs from this buffer
    setPass('normal'); renderer.setRenderTarget(normalRT);
    renderer.setClearColor(0x8080ff,1); renderer.clear(); passBegin('normals'); renderer.render(scene, cam); passEnd();
  }
  // 4+5. Low-res post (outlines, grade, dither, palette), then nearest upscale.
  //      At 1 screen px per art pixel with no CRT/vignette, the upscale is a pure copy,
  //      so the post pass writes straight to the screen (offset by the 1-texel margin).
  if (ps === 1 && psF === ps && S.crt === 0 && S.vignette === 0 && asciiAmt === 0 && magnify === 1){
    renderer.setRenderTarget(null); renderer.setViewport(-1/dpr, -1/dpr, lw/dpr, lh/dpr);   // three scales by pixel ratio
    passBegin('post'); renderer.render(postScene, quadCam); passEnd();
    renderer.setViewport(0, 0, innerWidth, innerHeight);
  } else {
    renderer.setRenderTarget(postRT); passBegin('post'); renderer.render(postScene, quadCam); passEnd();
    renderer.setRenderTarget(null); passBegin('upscale'); renderer.render(upScene, quadCam); passEnd();
  }
  if (S.profiler && frameNo % 15 === 0) drawProfiler(performance.now() - cpu0);
  if (frameNo % 10 === 0) document.getElementById('res').textContent = `${rw-2}×${rh-2} · ${psF.toFixed(psF % 1 ? 1 : 0)}px`;
  requestAnimationFrame(frame);
}

rebuildShadowTarget();
resize();
applyTexturePack();
registerPasses();
rebuildFoliage();
applyPreset('snes');
applyFolPreset('dither');
applyAsciiPreset('colour');
updateTriCount();
refreshUI();
requestAnimationFrame(frame);

/* =====================================================================
   PORTING NOTES — how each pass maps to Godot 4
   ---------------------------------------------------------------------
   Low-res render    → Render the 3D world inside a SubViewport sized to
                       floor(screen / pixel_size) + 2, shown through a
                       SubViewportContainer/TextureRect with texture_filter =
                       NEAREST (or stretch_shrink = pixel_size). Keep 3D
                       scaling off; the SubViewport size *is* the low res.
   Toon scene shader → spatial shader on the chunk mesh. Put the banding in
                       light(): DIFFUSE_LIGHT += floor(NdotL*ATTENUATION*bands+0.5)/bands
                       * LIGHT_COLOR. Godot's DirectionalLight3D/OmniLight3D
                       shadows replace the hand-rolled shadow map; AO and sky
                       exposure come in as CUSTOM0 vertex data from the C# mesher.
   Normals + depth   → In a post-process spatial shader (full-screen quad mesh
                       in front of the SubViewport camera, render_mode unshaded),
                       read hint_depth_texture and hint_normal_roughness_texture
                       (Forward+). Linearise depth with INV_PROJECTION_MATRIX.
   Outlines/grade/
   dither/palette    → Same spatial post shader (or a CompositorEffect compute
                       pass). Palette as a uniform vec3 array or a 64x1 sampler2D
                       with filter_nearest. Bayer from FRAGCOORD + dither offset.
   Pixel snapping    → In _process (C#): snap the Camera3D's position to texel
                       increments along its basis.x / basis.y, then offset the
                       TextureRect/canvas_item by the sub-texel remainder *
                       pixel_size (or pass it to a canvas_item shader that
                       shifts UV), exactly like uSub here. Render 1 texel of
                       margin so the shift never reveals an edge.
   Upscale           → canvas_item shader on the TextureRect:
                       COLOR = texture(TEXTURE, (floor(FRAGCOORD.xy/ps + 1.0 + sub) + 0.5) / low_res)
                       or just NEAREST filtering plus a pixel offset.
   Greedy meshing    → Port buildChunkGeometry() to C#, emitting ArrayMesh
                       surfaces per chunk; keep the "merge only uniform AO" rule.
   Edge rounding     → Same C# pass: put the 4 edge flags in the greedy merge key,
                       inset flagged quad edges by r, then emit bevel strips
                       (blended vertex normals), corner tris and caps per voxel.
                       Rounding only depends on the voxel and its 6 neighbours, so
                       a chunk needs just a 1-voxel border from adjacent chunks.
                       Costs roughly 2x the triangles of plain greedy meshing.
   Foliage           → spatial shader with `discard` for the dithered shell / leaf
                       cards; Godot reuses the same shader for its depth prepass and
                       shadow pass, so the holes match automatically (no per-pass
                       variants needed). Wind sway in vertex(). Tag foliage for the
                       outline pass by writing ROUGHNESS = 1.0 (read it back from
                       hint_normal_roughness_texture.a) or use a render layer mask.
                       Screen-door pattern: bayer(FRAGCOORD.xy + snapped offset).
   Block textures    → Bake the atlas once (C# Image → ImageTexture, or author it as a
                       PNG) and sample it in the spatial shader with filter_nearest.
                       Pass the block type as CUSTOM1 (or UV2.x) from the mesher;
                       derive face UVs from world position exactly as here so
                       greedy-merged quads tile without extra UV work.
   Art-style effects → Fog, wobble, watercolour edges, duotone, hatching and grain
                       all live in the low-res post shader (cheap: they run per art
                       pixel). CRT + vignette run in the screen-res canvas_item
                       upscale shader. Rim / specular go in the spatial light().
   Outlines          → Use world normals (or rotate Godot's view-space normals by
                       INV_VIEW_MATRIX) and the second-difference depth test.
   ===================================================================== */
</script>
</body>
