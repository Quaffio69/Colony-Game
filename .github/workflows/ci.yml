# On every push and pull request: the simulation's tests, and the launcher builds.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test tests/Colony.Core.Tests -c Release
      - name: Build the launcher
        run: dotnet build launcher/ColonyLauncher -c Release
